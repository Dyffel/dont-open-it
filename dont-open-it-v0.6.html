<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03121d">
<title>DON'T OPEN IT — Main Menu</title>
<style>
:root{color-scheme:dark;--gold:#ffd27a;--cyan:#48d9ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,Arial,sans-serif;background:#03121d;color:white}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.app{min-height:100svh;min-height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate;overflow:hidden}
.app::before{content:"";position:absolute;inset:-35px;z-index:-2;background:linear-gradient(#00121b55,#00121b77),url('menu-art.png') center/cover;filter:blur(26px) brightness(.43);transform:scale(1.06)}
/* Portrait: preserve EVERY pixel of the original art. The transparent buttons sit over the painted buttons. */
.portrait{position:relative;width:min(100vw,calc(100dvh * 2 / 3));aspect-ratio:2/3;background:url('menu-art.png') center/100% 100% no-repeat;box-shadow:0 0 65px #0008;flex-shrink:0}
.hit{position:absolute;border:0;background:transparent;color:transparent;touch-action:manipulation;border-radius:12px}.hit:active{background:#ffffff24}.hit.create{left:18%;top:60.8%;width:64%;height:9.0%}.hit.join{left:18%;top:70.5%;width:64%;height:9.6%}.hit.sound{left:3.5%;top:2.3%;width:10%;height:7%}.hit.settings{right:3.5%;top:2.3%;width:10%;height:7%}
/* Landscape: actual separate composition, NOT stretched/repeated portrait art. */
.landscape{display:none;width:min(1320px,96vw);min-height:min(86dvh,680px);gap:clamp(18px,4vw,70px);align-items:center;justify-content:center;padding:clamp(12px,2vw,30px)}
.chest-frame{position:relative;flex:1 1 54%;height:min(75dvh,590px);min-width:0;overflow:hidden;border:2px solid #247a91;border-radius:24px;box-shadow:0 25px 70px #000b,0 0 30px #00d9ff16;background:#031b2b}
.chest-frame img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 49%;filter:saturate(1.05)}
.chest-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00111b25 0%,transparent 38%,#00111b30 70%,#00111be0 100%);pointer-events:none}
.side{flex:1 1 46%;max-width:530px;text-align:center;display:flex;flex-direction:column;align-items:stretch;gap:clamp(10px,2.4vh,23px)}
.side h1{font-weight:1000;font-size:clamp(34px,5vw,82px);line-height:.9;letter-spacing:-2px;text-shadow:0 5px 0 #321b0b,0 10px 20px #000;margin:0 0 12px;color:#ffcd57}.side h1 span{display:block;color:#e9e5db}.side .tag{font-size:clamp(10px,1.25vw,15px);letter-spacing:.33em;color:#9fe7f2;margin:0 0 14px}.menu-button{width:100%;border-radius:17px;padding:clamp(12px,2.3vh,22px) 10px;font-weight:900;font-size:clamp(16px,2.2vw,29px);text-shadow:0 2px 2px #0008;box-shadow:0 8px 0 #000a,0 13px 20px #0008}.menu-button.gold{border:3px solid #ffedac;background:linear-gradient(#ffe87a,#eea800 47%,#b85d00);color:#241100}.menu-button.blue{border:3px solid #61efff;background:linear-gradient(#00c7ef,#0074b4 50%,#003b69);color:#fff}.small-actions{display:flex;justify-content:center;gap:14px}.small-actions button{border:1px solid #5bcfe5;background:#06263c;border-radius:11px;padding:10px 20px;color:#d7faff}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000b;backdrop-filter:blur(9px);padding:18px env(safe-area-inset-right) 18px env(safe-area-inset-left)}[hidden]{display:none!important}.dialog{position:relative;width:min(440px,100%);max-height:90dvh;overflow:auto;padding:clamp(20px,5vw,32px);border:2px solid #3ac7ee;border-radius:22px;background:linear-gradient(145deg,#0b3952,#03131f);box-shadow:0 20px 80px #000e;text-align:center}.dialog h2{font-family:Georgia,serif;color:#ffda79;font-size:clamp(28px,7vw,38px);margin:0 0 20px}.dialog label{display:block;text-align:left;color:#a9eaff;font-weight:800;letter-spacing:.06em;margin:12px 0 7px}.dialog input{display:block;width:100%;border:2px solid #3ac7ee;border-radius:11px;background:#001522;color:#fff;padding:13px;font-size:18px}.dialog .menu-button{margin-top:20px;font-size:19px;padding:13px}.back{margin-top:18px;background:none;color:#b2ecff;border:0;padding:10px}.notice{font-size:13px;color:#c3dbe4;line-height:1.5;min-height:20px}.close{position:absolute;top:9px;right:12px;border:0;background:none;color:white;font-size:27px}
@media(orientation:landscape) and (min-width:600px){.portrait{display:none}.landscape{display:flex}}
@media(orientation:landscape) and (max-height:450px){.landscape{min-height:0;padding:5px}.chest-frame{height:78dvh}.side{gap:7px}.side h1{font-size:clamp(28px,4vw,50px);margin-bottom:0}.side .tag{margin-bottom:0}.menu-button{padding:8px 6px}.small-actions button{padding:5px 12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
 <main class="portrait" aria-label="DON'T OPEN IT main menu">
  <button class="hit sound" aria-label="Sound settings" onclick="openMenu('settings')"></button>
  <button class="hit settings" aria-label="Settings" onclick="openMenu('settings')"></button>
  <button class="hit create" aria-label="Create lobby" onclick="openMenu('create')"></button>
  <button class="hit join" aria-label="Join lobby" onclick="openMenu('join')"></button>
 </main>
 <main class="landscape" aria-label="DON'T OPEN IT landscape main menu">
  <div class="chest-frame"><img src="menu-art.png" alt="Mysterious glowing treasure chests in a dark temple"></div>
  <section class="side"><h1><span>DON'T</span>OPEN IT</h1><p class="tag">EVERY BOX HAS A SECRET</p>
   <button class="menu-button gold" onclick="openMenu('create')">▣ &nbsp; CREATE LOBBY</button>
   <button class="menu-button blue" onclick="openMenu('join')">♟ &nbsp; JOIN LOBBY</button>
   <div class="small-actions"><button onclick="openMenu('settings')">⚙ Settings</button></div>
  </section>
 </main>
</div>
<div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="heading"><button class="close" aria-label="Close" onclick="closeMenu()">×</button><h2 id="heading"></h2><form id="lobbyForm"><div id="inputs"></div><button class="menu-button gold" type="submit">CONTINUE</button></form><p class="notice" id="notice"></p><button class="back" onclick="closeMenu()">← BACK TO MENU</button></section></div>
<script>
'use strict';
const overlay=document.getElementById('overlay'),form=document.getElementById('lobbyForm'),inputs=document.getElementById('inputs'),notice=document.getElementById('notice');let mode='create',previousFocus=null;
function openMenu(type){mode=type;previousFocus=document.activeElement;document.getElementById('heading').textContent=type==='create'?'Create Lobby':type==='join'?'Join Lobby':'Settings';form.hidden=type==='settings';inputs.replaceChildren();if(type!=='settings'){const label=document.createElement('label');label.htmlFor='nickname';label.textContent='YOUR NAME';const name=document.createElement('input');name.id='nickname';name.name='name';name.maxLength=20;name.required=true;name.autocomplete='nickname';name.placeholder='Enter your name';inputs.append(label,name);if(type==='join'){const codeLabel=document.createElement('label');codeLabel.htmlFor='code';codeLabel.textContent='LOBBY CODE';const code=document.createElement('input');code.id='code';code.name='code';code.maxLength=8;code.required=true;code.autocapitalize='characters';code.placeholder='Enter lobby code';inputs.append(codeLabel,code)}}notice.textContent=type==='settings'?'Menu preview: audio and multiplayer are not connected yet.':'Visual prototype only. Multiplayer lobby creation and joining will be connected to Supabase later.';overlay.hidden=false;setTimeout(()=>{(inputs.querySelector('input')||overlay.querySelector('.close')).focus()},50)}
function closeMenu(){overlay.hidden=true;previousFocus?.focus()}
form.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(form);const name=String(data.get('name')||'').trim();if(!name)return;notice.textContent=`Hi ${name}! This menu is ready, but online ${mode==='create'?'lobby creation':'lobby joining'} isn't connected yet.`});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeMenu()});
</script>
</body>
</html>
