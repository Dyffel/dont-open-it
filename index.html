<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#001a2b">
<title>DON'T OPEN IT — Main Menu</title>
<style>
:root{color-scheme:dark;--gold:#ffcf56;--cyan:#40dfff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,Arial,sans-serif;color:white;background:#001827}
body{min-height:100dvh;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{position:relative;min-height:100dvh;isolation:isolate;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#001827}
.app::before{content:"";position:absolute;inset:-30px;z-index:-2;background:url('menu-art.png') center/cover no-repeat;filter:blur(24px) brightness(.45);transform:scale(1.08)}
.app::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#00152230,#00152200 35%,#001522aa)}
/* The original art is NEVER stretched: its aspect ratio is preserved. */
.portrait{position:relative;width:min(100vw,calc(100dvh * 1024 / 1536));aspect-ratio:1024/1536;flex:none;background:url('menu-art.png') center/contain no-repeat;box-shadow:0 0 70px #0008}
.hotspot{position:absolute;border:0;background:transparent;border-radius:14px;touch-action:manipulation}
.hotspot:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.hotspot:active{background:#ffffff28}
.sound{left:2%;top:1.5%;width:10%;height:6%}.settings{right:2%;top:1.5%;width:10%;height:6%}
.create{left:17%;top:55.2%;width:66%;height:8.7%}.join{left:17%;top:65%;width:66%;height:8.5%}
/* Hide the five theme cards in portrait with a matching dark ocean gradient.
   Artwork above the cards, including both lobby buttons, remains untouched. */
.theme-cover{position:absolute;left:0;right:0;top:76.5%;bottom:0;pointer-events:none;background:linear-gradient(180deg,#001f3100 0%,#001b2d 35%,#001625 100%)}
/* A dedicated wide layout: no repeated logo or distorted image. */
.wide{display:none}
@media(orientation:landscape) and (min-width:650px){
 .portrait{display:none}
 .app{padding:max(16px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
 .wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.78fr);gap:clamp(14px,4vw,64px);align-items:center;width:min(1120px,100%);height:min(100%,700px);max-height:calc(100dvh - 28px)}
 .wide-art{position:relative;min-width:0;height:min(76dvh,570px);border-radius:24px;overflow:hidden;border:2px solid #4adfff77;box-shadow:0 15px 65px #000a;background:#002b42}
 .wide-art::before{content:"";position:absolute;inset:0;background:url('menu-art.png') center 36%/cover no-repeat;filter:brightness(.8)}
 .wide-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#001827dd,transparent 48%)}
 .wide-logo{position:absolute;z-index:1;top:5%;left:5%;right:5%;text-align:center;font-size:clamp(21px,3.2vw,43px);line-height:1;font-weight:1000;letter-spacing:-1px;color:#ffcc5c;text-shadow:0 4px #5e2600,0 7px 12px #000;-webkit-text-stroke:.5px #442000}
 .wide-menu{min-width:0;display:flex;flex-direction:column;gap:clamp(10px,3vh,23px);align-items:stretch}
 .wide-menu h1{font-size:clamp(28px,4vw,57px);line-height:.98;text-align:center;margin:0 0 5px;color:#ffda79;text-shadow:0 4px #603200,0 8px 22px #000;font-weight:1000}
 .wide-menu p{text-align:center;color:#9eeaff;letter-spacing:3px;font-size:clamp(10px,1.4vw,14px);margin:0 0 8px}
 .game-btn{width:100%;border-radius:15px;min-height:clamp(48px,12vh,82px);font-weight:1000;font-size:clamp(17px,2.3vw,29px);text-shadow:0 2px 3px #0008;box-shadow:0 7px 0 #0009,0 10px 25px #0008}
 .game-btn.gold{color:#fff5db;border:3px solid #ffdc79;background:linear-gradient(#ffdc69,#f6a800 47%,#965006)}
 .game-btn.blue{color:white;border:3px solid #57e8ff;background:linear-gradient(#188cbd,#005481 53%,#003047)}
 .wide-tools{display:flex;justify-content:center;gap:14px}.wide-tools button{border:1px solid #59dfff88;border-radius:12px;background:#002b45cc;color:#fff;padding:9px 18px}
}
@media(orientation:landscape) and (max-height:390px){.wide-art{height:70dvh}.wide-menu{gap:7px}.wide-menu h1{font-size:28px}.wide-menu p{margin:0}.wide-tools button{padding:5px 14px}}
.overlay{position:fixed;inset:0;z-index:10;background:#00101ce8;display:grid;place-items:center;padding:18px;backdrop-filter:blur(9px);overflow-y:auto}
[hidden]{display:none!important}
.dialog{width:min(430px,100%);max-height:94dvh;overflow:auto;padding:clamp(20px,5vw,30px);background:linear-gradient(155deg,#074363,#001726);border:2px solid #56e1ff;border-radius:22px;box-shadow:0 20px 70px #000b;text-align:center}
.dialog h2{font:800 clamp(27px,7vw,39px) Georgia,serif;color:#ffdc83;margin:5px 0 22px}
.dialog label{display:block;text-align:left;color:#a6efff;font-size:14px;letter-spacing:1.3px;font-weight:800;margin:16px 0 8px}
.dialog input{width:100%;padding:14px;border:2px solid #53dfff;border-radius:12px;background:#001a2a;color:#fff;font-size:19px}
.dialog input:focus-visible{outline:2px solid #fff}
.dialog .game-btn{margin-top:20px;min-height:58px;font-size:20px}
.secondary{margin-top:20px;border:1px solid #75dfff;border-radius:12px;background:#042e46;color:#fff;padding:12px 20px;width:100%;font-weight:800}
.notice{font-size:13px;color:#c3e7f1;line-height:1.55;margin:22px 0 0}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;width:max-content;max-width:90vw;background:#00263d;border:1px solid #5ce5ff;border-radius:12px;padding:12px 18px;text-align:center;box-shadow:0 8px 30px #0009}
</style>
</head>
<body>
<div class="app">
  <main class="portrait" aria-label="DON'T OPEN IT underwater menu">
    <button class="hotspot sound" aria-label="Sound settings" onclick="openDialog('settings')"></button>
    <button class="hotspot settings" aria-label="Settings" onclick="openDialog('settings')"></button>
    <button class="hotspot create" aria-label="Create lobby" onclick="openDialog('create')"></button>
    <button class="hotspot join" aria-label="Join lobby" onclick="openDialog('join')"></button>
    <div class="theme-cover" aria-hidden="true"></div>
  </main>
  <main class="wide" aria-label="DON'T OPEN IT wide menu">
    <div class="wide-art" aria-hidden="true"></div>
    <div class="wide-menu">
      <h1>DON'T<br>OPEN IT</h1>
      <p>THE SUNKEN KINGDOM</p>
      <button class="game-btn gold" onclick="openDialog('create')">🗝 CREATE LOBBY</button>
      <button class="game-btn blue" onclick="openDialog('join')">♟ JOIN LOBBY</button>
      <div class="wide-tools"><button onclick="openDialog('settings')">⚙ SETTINGS</button></div>
    </div>
  </main>
</div>
<div class="overlay" id="overlay" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle"></h2>
    <form id="form"><div id="fields"></div><button class="game-btn gold" type="submit">CONTINUE</button></form>
    <p class="notice" id="notice"></p>
    <button class="secondary" type="button" onclick="closeDialog()">← BACK TO MENU</button>
  </section>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const overlay=document.getElementById('overlay');
const form=document.getElementById('form');
const fields=document.getElementById('fields');
const notice=document.getElementById('notice');
const title=document.getElementById('dialogTitle');
let mode='create';
function openDialog(type){
 mode=type;
 title.textContent=type==='create'?'Create Lobby':type==='join'?'Join Lobby':'Settings';
 form.hidden=type==='settings';
 fields.replaceChildren();
 if(type!=='settings'){
  const nameLabel=document.createElement('label');nameLabel.htmlFor='playerName';nameLabel.textContent='YOUR NAME';
  const name=document.createElement('input');name.id='playerName';name.name='name';name.maxLength=20;name.required=true;name.placeholder='Enter your nickname';name.autocomplete='nickname';
  fields.append(nameLabel,name);
  if(type==='join'){
   const codeLabel=document.createElement('label');codeLabel.htmlFor='roomCode';codeLabel.textContent='LOBBY CODE';
   const code=document.createElement('input');code.id='roomCode';code.name='code';code.maxLength=8;code.required=true;code.placeholder='Enter lobby code';code.autocapitalize='characters';
   fields.append(codeLabel,code);
  }
 }
 notice.textContent=type==='settings'?'Visual menu preview. Music and sound effects are not implemented yet.':'Lobby creation and joining will work after the Supabase multiplayer connection is added.';
 overlay.hidden=false;
}
function closeDialog(){overlay.hidden=true}
form.addEventListener('submit',event=>{
 event.preventDefault();
 const data=new FormData(form);
 const name=String(data.get('name')||'').trim();
 if(!name)return;
 const code=String(data.get('code')||'').trim();
 if(mode==='join'&&!code)return;
 notice.textContent=`Welcome, ${name}! This is still a menu preview; no online lobby has been ${mode==='create'?'created':'joined'} yet.`;
});
overlay.addEventListener('click',event=>{if(event.target===overlay)closeDialog()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!overlay.hidden)closeDialog()});
</script>
</body>
</html>
